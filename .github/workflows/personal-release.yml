name: Personal Release

# Builds and publishes a release-signed APK of the personal branch, so that the
# app's built-in updater (GITHUB_REPO = arashari/mihon) can pick it up.
#
# Usage: bump `versionName` in app/build.gradle.kts, then push a matching tag:
#   git tag personal-0.20.4.2 && git push origin personal-0.20.4.2
#
# Keep versionName at 4 components: the updater compares only as many components
# as the installed version has, so a 3-component tag can't be detected.

on:
  push:
    tags:
      - 'personal-*'

env:
  MIHON_GITHUB_RELEASE: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: 'ubuntu-24.04'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Verify tag and signing secrets
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          set -euo pipefail

          version="$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)"
          expected="personal-$version"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::tag '$GITHUB_REF_NAME' does not match versionName '$version' (expected '$expected')"
            exit 1
          fi

          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::missing repo secret SIGNING_KEY"
            exit 1
          fi

          echo "building version $version"

      - name: Build
        run: ./gradlew :app:assembleRelease
        env:
          storeFileBase64: ${{ secrets.SIGNING_KEY }}
          storePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyAlias: ${{ secrets.ALIAS }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Stage APKs
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#personal-}"
          mkdir -p stage
          cp app/build/outputs/apk/release/app-universal-release.apk "stage/mihon-$version.apk"
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            cp "app/build/outputs/apk/release/app-$abi-release.apk" "stage/mihon-$abi-$version.apk"
          done
          ls -l stage

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#personal-}"
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Mihon Personal $version" \
            --notes "Personal build of Mihon. Installs alongside official Mihon as \`app.mihon.personal\`." \
            stage/*.apk
